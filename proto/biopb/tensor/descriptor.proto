syntax = "proto3";

package biopb.tensor;

option java_multiple_files = true;
option java_package = "biopb.tensor";

// ============================================================================
// Tensor identity policy
//
// A tensor is identified by its array_id ALONE. array_id is GLOBALLY UNIQUE
// across the whole server.
//
// CONSTRUCTION. array_id is always built from the source and an optional
// within-source field name:
//   * single-tensor source: array_id = source_id           (e.g. "zarr_a3f2")
//   * multi-tensor source:  array_id = source_id "/" field  (e.g.
//                           "aics_7f3/Image:0", or an HCS "plate_x/A01/0")
// The source_id cannot contain a '/' (it is the prefix before the first '/'),
// but the field part MAY contain '/'.
//
// source_id is carried on the wire as a routing convenience, but array_id is
// AUTHORITATIVE; when both are present they MUST be consistent.
//
// INVARIANTS every producer/consumer upholds:
//   * For a given tensor the array_id is IDENTICAL across the catalog
//     (DataSourceDescriptor.tensors[].array_id), GetFlightInfo (the response
//     TensorDescriptor.array_id), and the adapter's own tensor descriptor --
//     always the full source_id[/field] form.
//   * SDKs key their descriptor cache by array_id (it is globally unique);
//     keying by (source_id, array_id) is also correct but redundant.
//   * chunk_id encodes the array_id directly as a length-prefixed binary field,
//     so an embedded '/' is just payload (safe). A Flight ticket carries no
//     source_id field, so recovering source_id from a chunk's array_id uses the
//     same split-on-the-first-'/' rule.
//
// VERSIONED FORM (HTTP only). The HTTP sidecar publishes a content-versioned
// array_id, `source_id "@" token [ "/" field ]`, so a browser cache keyed on a
// tile URL cannot outlive the content it holds (biopb/biopb#780). The token is
// derived from DataSourceDescriptor.content_version. This form exists ONLY
// above the Flight wire: the sidecar strips it before every Flight call, and no
// adapter, chunk_id, catalog row or descriptor ever carries it. A '@' is legal
// in a field name and is untouched -- only the source_id half is parsed for it,
// and a source_id can never contain '@' (it is `<type>_<hex>`).
// ============================================================================

// Encoded into FlightDescriptor.cmd bytes (identifies the tensor)
message TensorDescriptor {
  // Globally-unique tensor identifier and primary key (see the tensor identity
  // policy above). Constructed as source_id (single-tensor) or source_id/field
  // (multi-tensor). Same value as TensorReadOption.array_id.
  string array_id = 1;

  // Maps dimension index to semantic label (e.g., ["z", "y", "x"])
  repeated string dim_labels = 2;

  // Full array shape (per dimension)
  repeated int64 shape = 3;

  // Nominal transfer chunk size per dimension (actual may vary for edge
  // chunks). This is the grid the tensor's chunks are delivered on, chosen by
  // the server-side adapter that knows how the bytes sit on disk; it is not the
  // store's own block size, and no read is issued at any other granularity.
  //
  // On a *response* it is the grid you will read on -- the tensor's own grid in
  // a describe, and for a scaled read the grid of that response's (already
  // reduced) chunks. It is answered ONLY by GetFlightInfo, which resolves the
  // tensor adapter first: the grid depends on facts that exist only once a
  // specific tensor/scene is bound (its backing chunk layout, its dimension
  // labels, format layout rules, the native pyramid level, the request scale),
  // so a source-level listing cannot own it. The catalog and
  // DataSourceDescriptor.tensors therefore carry it EMPTY -- like pyramid and
  // physical_scale -- and an empty grid is not a usable fallback: a client that
  // needs one for Dask construction, tiling or prefetching must describe the
  // tensor. (Empty also means "old server"; the field has always been optional.)
  //
  // On an upload *request* it is the grid you will write on -- it sets the
  // created store's blocking and the bounds every chunk must land on.
  repeated int64 chunk_shape = 4;

  // Element dtype (numpy-style, e.g., "uint8", "float32", "float64")
  string dtype = 5;

  // Optional slice hint - if provided, GetFlightInfo returns only chunks
  // covering this range. Leave unset/null to return all chunks.
  SliceHint slice_hint = 6;

  // Per-dimension integer downsampling factors for virtual/scaled reads.
  // Example: [1, 8, 8] means full resolution on first axis, 8x reduced on remaining.
  // These do not change tensor identity, only how a specific read request is planned.
  repeated int64 scale_hint = 7;

  // Dynamic reduction/downsampling method for scaled reads: "nearest", "area",
  // or "precompute" (serve a native on-disk pyramid level).
  // Compatibility aliases accepted: "stride" -> "nearest", "mean" -> "area",
  // "precomputed" -> "precompute", "linear" (deprecated) -> "area".
  // An empty or omitted value is resolved to "nearest" by the server.
  // Clients that want averaging must set this field explicitly to "area".
  // Note: already-cached chunk IDs that carry no method byte (issued before
  // this default was established) are decoded as "area" for compatibility;
  // only newly minted IDs default to "nearest".
  string reduction_method = 8;

  // Opaque JSON metadata compatible with OME-NGFF (.zattrs schema).
  // Contains: multiscales, axes, coordinateTransformations, channels, etc.
  // For precomputed pyramids: multiscales[].datasets[].path and scale info.
  // Empty string if no metadata available.
  string metadata_json = 9;

  // Server-advertised resolution pyramid: the ordered levels the server
  // recommends reading this tensor at, coarsest decision made server-side so
  // native (precomputed) pyramids are honored and the precache worker and
  // client request the same scales. Level 0 is full resolution
  // (scale_hint all 1s). A client reads each level via the normal scale_hint
  // read path. Populated only by GetFlightInfo (left empty in the catalog,
  // like metadata_json); empty also means "old server / decide client-side".
  repeated PyramidLevel pyramid = 10;

  // Per-dimension physical pixel size, aligned 1:1 with dim_labels/shape
  // (same length and order). Element i is the physical extent of one sample
  // along dimension i, in the unit given by physical_unit[i]. 0.0 means
  // "unknown" for that dimension. This is the ~200-byte summary consumers need
  // for display scale, so the common case avoids fetching the full OME tree.
  // Populated by GetFlightInfo (left empty in the catalog, like pyramid /
  // metadata_json); empty also means "old server / no physical scale -> the
  // full OME (metadata_json) remains the authoritative source".
  repeated double physical_scale = 11;

  // Per-dimension unit string for physical_scale (e.g. "micrometer", "µm"),
  // aligned 1:1 with physical_scale. "" means unknown.
  repeated string physical_unit = 12;

  // How far the upload backing this tensor has got, when one does; unset for
  // every ordinary (file-backed) source. Populated only by GetFlightInfo, like
  // `pyramid` and `physical_scale`, and left empty in the catalog.
  //
  // A live read, computed per request and stored nowhere -- which is what
  // biopb/biopb#1035 actually requires. It rides the *per-source* surface
  // because the caller who needs it holds a per-source credential and asks
  // about one object: that is the fast-return poller. A catalog-shaped
  // question would belong on a catalog-shaped surface.
  UploadStatus upload_status = 15;

  // 13 was chunk_array_id, the compact-grid read plan (biopb/biopb#346); removed
  // when the chunk_id codec was made a strictly server-side concern (the client
  // no longer regenerates chunk_ids). Reserved so the field number/name are never
  // reused.
  reserved 13;
  reserved "chunk_array_id";

  // Opaque per-source generation token, sampled once at (re-)registration
  // (biopb/biopb#178): the stat signature `mtime_ns:size` for a file/dir
  // source, `iat:<ts>` for a caching proxy's mirror. Two descriptors carrying
  // DIFFERENT tokens for one source describe different content; two carrying
  // the SAME token describe the same content. It is not ordered -- newer is not
  // "greater" -- and it is not a hash of the bytes, so an in-place edit that
  // preserves mtime and size is invisible to it.
  //
  // A SERVING field, like chunk_shape and pyramid: filled by GetFlightInfo from
  // the bound adapter, left empty on the structural DataSourceDescriptor.tensors
  // entries. It is a source-level property repeated on the tensor deliberately
  // -- consumers need it on the freshest thing in the request, and GetFlightInfo
  // is fetch-per-call by contract while a catalog listing is a natural thing to
  // cache (biopb/biopb#834).
  //
  // Absent means "no claim", not "unchanged": a source whose URL cannot be
  // stat'd (cloud, unresolved) leaves it unset, and consumers must degrade to
  // whatever freshness policy they used before rather than treating absence as
  // a stable version. Servers predating this field also leave it unset.
  //
  // Consumers use it to namespace caches they cannot otherwise invalidate. The
  // chunk cache already folds it into chunk_id; the HTTP sidecar folds it into
  // the array_id it publishes, so a browser cache keyed on a tile URL cannot
  // outlive the content (biopb/biopb#780).
  optional bytes content_version = 14;
}

// One resolution level of a tensor's server-advertised pyramid.
message PyramidLevel {
  // Per-dimension integer downsampling factors vs. full resolution.
  // Level 0 is [1, 1, ...]; matches TensorDescriptor.scale_hint semantics.
  repeated int64 scale_hint = 1;

  // Method to request this level: "area" | "nearest" | "precompute".
  // "precompute" means the server serves a native on-disk level (see `native`).
  string reduction_method = 2;

  // Logical (downsampled) shape of this level -- what a read of this level
  // returns, so the client can size the level without a probe read.
  repeated int64 shape = 3;

  // True if this level is served from a precomputed on-disk pyramid (e.g. an
  // OME-Zarr multiscales dataset) rather than downsampled on the fly.
  bool native = 4;
}

// How far the upload backing a tensor has got.
//
// Reported on the descriptor GetFlightInfo returns rather than by an action,
// because `do_action` takes full access while GetFlightInfo is source-scoped:
// a holder of the per-source read capability the fast-return path hands out
// must be able to poll its own result to READY (biopb/biopb#1048).
message UploadStatus {
  enum State {
    // Never sent. Present so a client meeting an unknown state reads it as
    // "I do not know this" rather than as PENDING.
    STATE_UNSPECIFIED = 0;
    // Chunks are still arriving, or the writer has not sealed the upload.
    PENDING = 1;
    // Sealed: everything the writer intended to send has landed.
    READY = 2;
    // Given up on, terminal. `reason` says why.
    DISCARDED = 3;
  }
  State state = 1;

  // The chunk grid declared at create time.
  int64 expected_chunks = 2;

  // Distinct chunks that have landed; frozen at the count reached once
  // DISCARDED.
  int64 uploaded_chunks = 3;

  // Why the upload was discarded; empty otherwise. Consumer-facing -- it is a
  // message to whoever was waiting on the result, not a log line, so a
  // producer should not put a raw traceback in it.
  string reason = 4;
}

// Specifies a sub-region of the tensor for filtered endpoint discovery
message SliceHint {
  // Start indices (per dimension)
  repeated int64 start = 1;
  // Stop indices (exclusive, per dimension)
  repeated int64 stop = 2;
}

// A read-only SQL query against the server's public catalog (the `catalog`
// flight), carried in a TensorTicket so DoGet answers it in one call.
message CatalogQuery {
  // SQL query string (e.g., "SELECT source_id FROM sources WHERE source_type='ome-zarr'")
  string sql = 1;
}

// Tensor read request: the `data` flight's GetFlightInfo command.
// Flattened structure - no nested messages for read options.
message TensorReadOption {
  // Which tensor to read: its globally-unique array_id ("source_id" or
  // "source_id/field", per the identity policy at the top of this file). A bare
  // source_id selects the source's default (first) tensor (#44).
  string array_id = 1;

  // Optional sub-region to read
  SliceHint slice_hint = 2;

  // Per-dimension integer downsampling factors.
  // Example: [1, 8, 8] means full resolution on first axis, 8x reduced on remaining.
  repeated int64 scale_hint = 3;

  // Dynamic reduction/downsampling method: "nearest", "area", or
  // "precompute" (serve a native on-disk pyramid level).
  // Compatibility aliases accepted: "stride" -> "nearest", "mean" -> "area",
  // "precomputed" -> "precompute", "linear" (deprecated) -> "area".
  string reduction_method = 4;

  // If true, server populates metadata_json with wrapped metadata.
  // Wrapped structure: {"type": source_type, "dim_label": [...], "metadata": {...}}
  bool with_metadata = 5;

  // If true, server advertises the resolution pyramid on the response
  // descriptor (TensorDescriptor.pyramid). Opt-in (default false): advertising a
  // native pyramid opens each level's store to size it (network I/O per level
  // for a cloud store), so a client that does not consume the pyramid does not
  // pay for it. physical_scale, the other cheap describe fact, is filled
  // unconditionally.
  bool with_pyramid = 7;

  // Whether to enumerate the per-request chunk endpoints (the O(chunks) read
  // plan). Default true -- a normal read needs the endpoints; an old client that
  // omits the field is served the full plan, exactly as before. Set false for a
  // describe-only GetFlightInfo: the response carries the descriptor
  // (shape/dtype/pyramid/physical_scale/metadata_json, per the other masks) with
  // an empty endpoint list, skipping the plan. `optional` so the *unset* default
  // is true (a proto3 bool would default false).
  optional bool with_read_plan = 8;

  // 6 was compact_grid_ok, the opt-in to a compact-grid read plan
  // (biopb/biopb#346); removed when the chunk_id codec was made a strictly
  // server-side concern. Reserved so the field number/name are never reused.
  reserved 6;
  reserved "compact_grid_ok";
}

// The GetFlightInfo command. Dispatch is the oneof arm, nothing else: a
// tensor read plans chunk endpoints for one tensor (private data, authorized
// on the tensor's source). The catalog needs no command here -- a table is
// addressed by a path descriptor, and an arbitrary query rides the DoGet
// ticket (CatalogQuery in TensorTicket).
//
// Tags start at 11 so a request from a protocol-1 client (the retired
// `FlightCmd`, tags 1-3) never parses into a set arm here; the wrapper is
// that firewall, which is why it stays even with one arm.
message FlightRequest {
  oneof request {
    TensorReadOption tensor_read = 11;
  }
}

// Describes a data source containing one or more tensors. Enables multifield
// support where tensors within a source have different shapes.
//
// NOT a wire type: no message carries one, and no action returns one. A source
// crosses the wire only as its `sources` catalog row, and each SDK rebuilds
// this from that row as its own structural view. The shapes are identical --
// this is here to name the row's fields and their contract, not to be a second
// encoding of them. Do not put it back on an action.
message DataSourceDescriptor {
  // Unique identifier for the data source (flight identifier)
  string source_id = 1;

  // File path, directory, or remote URL
  string source_url = 2;

  // Source type: "aics", "micromanager", "ome-zarr", "zarr", "hdf5", etc.
  string source_type = 3;

  // Every tensor in this source, as a STRUCTURAL catalog entry: array_id,
  // dim_labels, shape, dtype. The serving fields are left empty here --
  // chunk_shape (the transfer grid), pyramid, physical_scale, metadata_json --
  // because a source lists all its tensors without binding any of them, and
  // those are answered by the adapter GetFlightInfo binds to one tensor. Read
  // this to enumerate and address; describe the tensor to plan a read.
  repeated TensorDescriptor tensors = 4;

  // Source-level OME/vendor metadata (JSON format)
  string metadata_json = 5;

  // DEAD: no current server fills this. Residency is volatile -- a
  // synced-folder source re-dehydrates with no event to refresh from -- so the
  // catalog dropped its column and the `is_resident` action answers it live
  // (biopb/biopb#1035). Kept only so the deprecated row decoders still fill it
  // from an older server's row.
  optional bool data_resident = 6;
}

// Progress heartbeat for an in-flight "resolve" Flight action. Resolving a
// dehydrated cloud / synced-folder source is a whole-file recall that can take
// minutes; the action streams these periodically so a client can show progress
// and decide whether to cancel, and so the empty-looking response does not trip
// proxy idle read timeouts. Informational only -- carries no pixels.
message ResolveProgress {
  // Seconds elapsed since resolution began on the server.
  double elapsed_seconds = 1;

  // Human-readable name of the recall target (file / directory basename), or
  // empty when the server cannot name it.
  string target_name = 2;

  // Size in bytes of the recall target, or 0 when unknown (e.g. a directory, a
  // remote URL, or a stat failure).
  int64 target_bytes = 3;
}

// One message in the "resolve" action's result stream. The server emits zero or
// more `progress` heartbeats followed by exactly one terminal `source_row`
// carrying the source's now-resolved catalog row.
message ResolveStreamMessage {
  // Field 2 was `DataSourceDescriptor result`. The server had to build that
  // from the adapter a second time, after it had already written the catalog
  // row -- two encodings of one projection, which could disagree on
  // `data_resident` (the adapter answered live, the row was a snapshot; the
  // column is since gone for that same reason). The row it just wrote is now
  // what comes back.
  reserved 2;

  oneof payload {
    ResolveProgress progress = 1;

    // Arrow IPC stream: exactly one `sources` row, with the same columns the
    // catalog flight serves (source_id, source_url, source_type, is_resolved,
    // tensors). A client decodes it however it likes -- the row is the data
    // structure, and the SDKs pick none (biopb/biopb#1032).
    bytes source_row = 3;
  }
}

// Progress for an in-flight "warm" (hydrate-ahead) Flight action. After a
// source is resolved, a multi-file cloud source's member data files are still
// dehydrated and recall one-at-a-time onto the lazy read path. "warm" opts into
// pulling them all resident on the server up front: it walks the source
// directory and reads each file to force the sync engine's recall, streaming
// these so a client can show progress (files / bytes) and cancel. The recall
// happens server-side -- no pixels cross the wire, only this progress.
// Informational only.
message WarmProgress {
  // Total regular files discovered under the source (the recall-free stat
  // pass). 0 while still enumerating.
  int32 files_total = 1;

  // Files fully read (made resident) so far.
  int32 files_done = 2;

  // Sum of file sizes in bytes (stat is recall-free), or 0 while enumerating.
  int64 bytes_total = 3;

  // Bytes read (recalled) so far.
  int64 bytes_done = 4;

  // Basename of the file currently being recalled, or empty.
  string current_name = 5;

  // Seconds elapsed since warming began on the server.
  double elapsed_seconds = 6;
}

// One message in the "warm" action's result stream. The server emits zero or
// more `progress` updates followed by exactly one terminal `done` snapshot. On
// normal completion `done.files_done == done.files_total`; on cancellation (the
// client closing the stream) the `done` reflects partial progress. A
// single-file source yields one `done` with files_total == 0. A remote-url
// source (an object store, or a `grpc://` mirror) fails instead: nothing on the
// serving machine can be made resident, and a zero count would read as "done".
message WarmStreamMessage {
  oneof payload {
    WarmProgress progress = 1;
    WarmProgress done = 2;
  }
}

// Request body for the "add_source" Flight action: register an existing path
// (or remote URL) on the SERVER's filesystem as a served source at runtime and
// start serving it. This is the wire entrypoint into the same claim -> adapter
// -> catalog pipeline the directory watcher uses; a dropped directory may
// register several sources. The action streams AddSourceStreamMessage so a slow
// recursive walk reports progress and can be cancelled.
message AddSourceRequest {
  // Absolute path or remote URL, interpreted on the SERVER's filesystem.
  string url = 1;

  // Explicit adapter type ("zarr", "ome-zarr", ...); empty means auto-detect via
  // the adapters' claim() protocol.
  string source_type = 2;

  // Source axes come from the format; registration cannot relabel them.
  reserved 3;
  reserved "dim_labels";

  // Field 4 was `bool monitor` — a drag-drop could register a live-monitored
  // root that existed in no config (invisible, unpersisted, self-re-adding after
  // removal). Removed as a footgun; never exercised by any client. Reserved so
  // the tag is not reused.
  reserved 4;
  reserved "monitor";
}

// Progress heartbeat for an in-flight "add_source" action: one emitted per
// source as the walk registers it. Informational only -- carries no pixels.
// There is deliberately NO total: discovery is a walk over a tree of unknown
// size, so progress is count-up, not a fraction.
message AddSourceProgress {
  // Number of sources registered so far in this request.
  int32 added_count = 1;

  // Path currently being scanned / just registered (for a "Scanning ..." label),
  // or a short status sentence while the add waits (e.g. for a catalog rescan).
  string current_path = 2;
}

// One source that could not be registered, with a user-readable reason (e.g.
// "already part of <source_id>", "no supported datasets found", "not a
// recognized image format").
message AddSourceFailure {
  string path = 1;
  string reason = 2;
}

// Terminal message of the "add_source" stream: the tally of what happened.
message AddSourceResult {
  // Field 1 was `repeated DataSourceDescriptor added`: a full descriptor per
  // source, which no client ever read past its length. Registration already
  // wrote each source's catalog row, so anything more than the ids belongs in a
  // catalog query the caller makes when it wants it.
  reserved 1;

  // source_ids newly registered by this request.
  repeated string added = 6;

  // source_ids that were already registered (same deterministic id) -- upsert
  // no-ops, surfaced so the client can say "already present" rather than
  // "nothing happened".
  repeated string already_present = 2;

  // Paths that failed to register, each with its reason. A directory dropped
  // above the large-scan threshold is declined here too ("directory too large
  // to scan on drop -- drop a subfolder, or add it via the server config file").
  repeated AddSourceFailure failed = 3;

  // source_ids whose adapter was rebuilt against the file as it is now -- the
  // only thing that resamples the descriptor and the content_version that
  // namespaces the chunk cache (biopb/biopb#944). A subset of `already_present`,
  // which keeps its meaning so an older client still reads a re-drop as
  // "already present".
  repeated string refreshed = 4;

  // source_ids deregistered because their files are gone from under the
  // dropped path.
  repeated string removed = 5;
}

// One message in the "add_source" action's result stream: zero or more
// `progress` heartbeats followed by exactly one terminal `result`.
message AddSourceStreamMessage {
  oneof payload {
    AddSourceProgress progress = 1;
    AddSourceResult result = 2;
  }
}

// Request body for the "remove_source" Flight action: deregister a drag-dropped
// source branch at runtime. This is a deliberately narrow counterpart to
// "add_source" -- it only removes drag-dropped sources, never a configured or
// discovered one, so the server authorizes purely on the `dnd://` origin scheme
// stamped on a drop's catalog source_url. A non-`dnd://` root_url is rejected.
message RemoveSourceRequest {
  // The dnd:// branch root to remove. Every source whose catalog source_url is
  // this value, or is under it (has the `root_url + "/"` prefix), is removed --
  // so one dropped folder's sources go as a unit. MUST carry the dnd:// scheme.
  string root_url = 1;
}

// Terminal (single, non-streamed) result of the "remove_source" action.
message RemoveSourceResult {
  // source_ids actually deregistered.
  repeated string removed = 1;

  // Sources that matched the branch but could not be removed (e.g. already gone
  // from a concurrent rescan). Reuses AddSourceFailure: its `path` field carries
  // the source_id here, `reason` the explanation.
  repeated AddSourceFailure failed = 2;
}
