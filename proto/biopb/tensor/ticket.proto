syntax = "proto3";

package biopb.tensor;

import "biopb/tensor/descriptor.proto";

option java_multiple_files = true;
option java_package = "biopb.tensor";

// Encoded into FlightEndpoint.ticket bytes; what DoGet serves is the oneof arm.
message TensorTicket {
  oneof payload {
    // One pixel chunk of the `data` flight. Opaque, server-minted: the client
    // echoes it back and never decodes it (the encoding is the server's own).
    bytes chunk_id = 1;
    // One read of the public `catalog` flight. The ticket carries the SQL
    // itself, so a client may skip GetFlightInfo and DoGet in one call.
    CatalogQuery catalog_query = 2;
    // One tensor's annotation set from the `roi` flight (private data).
    RoiRead roi_read = 3;
  }
}

// A tensor's annotations, as rows of the ROI row schema (biopb.image). The
// stream's schema metadata carries `truncated` and the tensor's `sets` (JSON).
message RoiRead {
  // Unversioned array_id of the annotated tensor.
  string array_id = 1;
  // Restrict to one layer, and the only way to read a reserved ("@") set.
  // Empty -> the tensor's client-owned sets.
  string set_name = 2;
}

// Encoded into FlightEndpoint.app_metadata bytes
// Describes chunk bounds so client can map array coords to cached chunks
message ChunkBounds {
  // Chunk start position in array coordinates (per dimension)
  repeated int64 start = 1;
  // Chunk stop position in array coordinates (exclusive, per dimension)
  repeated int64 stop = 2;
}

// FlightDescriptor.command bytes of a DoPut; what the stream carries is the
// oneof arm. A source is created by the `create_source` action, not here.
message PutCommand {
  oneof command {
    // The stream is one pixel chunk (writable servers only).
    ChunkUpload chunk = 1;
    // The stream is annotations in the ROI row schema; the reply is a
    // biopb.image.RoiPutResult in the put's app_metadata.
    RoiPut roi_put = 2;
    // The stream is one `roi_id` column, or empty; the reply is a
    // biopb.image.RoiDeleteResult in the put's app_metadata.
    RoiDelete roi_delete = 3;
  }
}

// Wrapper for chunk upload DoPut
message ChunkUpload {
  // Source identifier (e.g., "cache_abc123" or "ome_zarr_def456")
  string source_id = 1;
  // Chunk bounds (start/stop coordinates)
  ChunkBounds bounds = 2;
  // The upload session this write belongs to, from `create_source`.
  //
  // `source_id` names the object; this names the *attempt* at filling it. A
  // second `create_source` for the same `cache:name` opens a new session and
  // displaces the first, so a straggler from the old one would otherwise land
  // in the new source undetected. The server refuses a write whose session is
  // not the current one, and says superseded rather than "not found" -- which
  // is the only way a displaced producer learns what happened, since status is
  // keyed by `source_id` and reports the new session's progress.
  string session_id = 3;
}

// Body of the `finish` action: seal an upload against further writes.
//
// Both ids, because they answer different questions: `source_id` finds the
// upload, `session_id` says which attempt is claiming to have completed it.
message FinishUpload {
  string source_id = 1;
  string session_id = 2;
}

// Reply to the `create_source` action.
//
// Not a bare TensorDescriptor (which is what it was): a create both names the
// object and opens the session that may write to it, and the descriptor has no
// business carrying a write-path identity -- readers get descriptors too.
message CreateSourceResult {
  // The resolved descriptor, echoing the request under the minted `array_id`.
  //
  // NOT named `descriptor`: that generates a `getDescriptor()` colliding with
  // the static one every generated Java message already has, and the Java
  // build is the only place that shows it.
  TensorDescriptor tensor_descriptor = 1;
  // The session `ChunkUpload` and `FinishUpload` must carry.
  string session_id = 2;
}

// Create-or-update a batch of annotations, applied in one transaction.
message RoiPut {
  // The tensor every annotation in this batch belongs to (unversioned
  // array_id). Each row's array_id must match it or be empty.
  string array_id = 1;
  // Optimistic concurrency. When true, an annotation whose `rev` differs from
  // the stored one is reported as a conflict and NOT applied; the rest of the
  // batch still lands. When false, last writer wins.
  bool check_rev = 2;
}

// Delete the streamed `roi_id`s; with an empty stream, every annotation on
// `array_id` in `set_name` (or every annotation on the tensor when `set_name`
// is empty too).
message RoiDelete {
  string array_id = 1;
  string set_name = 2;
}
