syntax = "proto3";

package biopb.tensor;

import "biopb/tensor/descriptor.proto";

option java_multiple_files = true;
option java_package = "biopb.tensor";

// Encoded into FlightEndpoint.ticket bytes; what DoGet serves is the oneof arm.
message TensorTicket {
  oneof payload {
    // One pixel chunk of the `data` flight. Opaque, server-minted: the client
    // echoes it back and never decodes it (the encoding is the server's own).
    bytes chunk_id = 1;
    // One read of the public `catalog` flight. The ticket carries the SQL
    // itself, so a client may skip GetFlightInfo and DoGet in one call.
    CatalogQuery catalog_query = 2;
    // One tensor's annotation set from the `roi` flight (private data).
    RoiRead roi_read = 3;
    // One pixel chunk of the `data` flight, named by a plan-wide stub plus the
    // chunk's grid index instead of by a chunk_id of its own. See ChunkRef.
    ChunkRef chunk_ref = 4;
  }
}

// One pixel chunk, as `stub + index`.
//
// A GetFlightInfo that is asked for `ticket_stub` returns the stub once, on
// the descriptor, and each endpoint's ticket carries only the `index`. The
// ticket DoGet takes is the two joined: serialized protobuf messages merge
// when concatenated, so `stub_bytes + endpoint_ticket_bytes` is one ChunkRef
// carrying both, and a client needs no codec to build it.
//
// The server expands `(stub.identity, index)` into the chunk_id it always
// served, so the cache, the staleness check and the upload path see the same
// bytes they did before; nothing below the ticket changed.
message ChunkRef {
  TicketStub stub = 1;
  // The chunk's absolute position on the tensor's chunk grid, one entry per
  // axis. Absolute rather than relative to the plan's window, so one chunk
  // reads the same bytes whichever plan reached it.
  repeated uint32 index = 2;
}

// What every chunk of one plan shares, split by how long it stays true.
//
// The two halves are separate fields so they can be told apart without being
// understood: a cache keys on `identity` and ignores `grant`, whose expiry and
// seal change every time the plan is made.
message TicketStub {
  // Which tensor, version, scale, method and grid. Opaque, server-minted, and
  // stable: the same tensor, read the same way, mints the same bytes. A client
  // echoes it back and a proxy wraps it, and neither reads it.
  bytes identity = 1;
  // The authority to read this plan's chunks, in place of a bearer token.
  ChunkGrant grant = 2;
}

// A seal over a TicketStub's identity, the window of chunks the plan covers,
// and an expiry. Whoever holds it may read exactly those chunks until it
// expires, with no other credential.
message ChunkGrant {
  // The plan's window on the chunk grid, [window_start, window_stop) per axis.
  // A chunk_ref whose index falls outside it is refused.
  repeated uint32 window_start = 1;
  repeated uint32 window_stop = 2;
  // Unix seconds after which the seal is refused; 0 never expires.
  uint64 expires_at = 3;
  // A MAC the server computes over the identity, window and expiry, keyed by a
  // secret that persists across restarts. Rotating the key revokes every seal
  // outstanding.
  bytes seal = 4;
}

// A tensor's annotations, as rows of the ROI row schema (biopb.image). The
// stream's schema metadata carries `truncated` and the tensor's `sets` (JSON).
//
// A GetFlightInfo asked for `ticket_stub` returns, on the descriptor, the
// ticket that reads every set of the tensor with `grant` filled in. A holder
// that wants one set merges `RoiRead{set_name}` onto it the same way.
message RoiRead {
  // Unversioned array_id of the annotated tensor.
  string array_id = 1;
  // Restrict to one layer, and the only way to read a reserved ("@") set.
  // Empty -> the tensor's client-owned sets.
  string set_name = 2;
  // The authority to read this tensor's annotations, in place of a bearer
  // token. Absent on a ticket a bearer-authenticated caller makes itself.
  RoiGrant grant = 3;
}

// A seal over a tensor's id, its content version, and an expiry. The version
// is in it so a tensor name that is reused cannot inherit the grant of the
// tensor that had it before.
message RoiGrant {
  // The tensor's content version when the seal was made.
  bytes content_version = 1;
  // Unix seconds after which the seal is refused; 0 never expires.
  uint64 expires_at = 2;
  bytes seal = 3;
}

// Encoded into FlightEndpoint.app_metadata bytes
// Describes chunk bounds so client can map array coords to cached chunks
message ChunkBounds {
  // Chunk start position in array coordinates (per dimension)
  repeated int64 start = 1;
  // Chunk stop position in array coordinates (exclusive, per dimension)
  repeated int64 stop = 2;
}

// FlightDescriptor.command bytes of a DoPut; what the stream carries is the
// oneof arm. A tensor is added to a source by the `add_tensor` action; DoPut
// creates nothing, and nothing creates a source.
message PutCommand {
  oneof command {
    // The stream is one pixel chunk (writable servers only). The bytes are a
    // `FlightEndpoint.ticket` from this tensor's own GetFlightInfo plan,
    // echoed back verbatim -- the same ticket DoGet takes once the upload is
    // READY. One planner decides what a chunk is, on both transports: the
    // client neither tiles nor decodes, and a write inherits the version and
    // epoch checks a read already has. A ticket of another tensor, or a
    // scaled one, is refused.
    bytes chunk_ticket = 1;
    // The stream is annotations in the ROI row schema; the reply is a
    // biopb.image.RoiPutResult in the put's app_metadata.
    RoiPut roi_put = 2;
    // The stream is one `roi_id` column, or empty; the reply is a
    // biopb.image.RoiDeleteResult in the put's app_metadata.
    RoiDelete roi_delete = 3;
  }
}

// Body of the `set_upload_status` action: move an upload along its ladder.
//
// One action for every transition, because they are one decision made
// repeatedly about one object -- and because the alternative had grown a verb
// per transition (`finish`, `delete_labels`) that each had to re-derive which
// object it was talking about.
message SetUploadStatus {
  // What is being moved, as `add_tensor` answered with it:
  // `<source_id>/@fields/<name>` for an uploaded tensor, or a label set's
  // `<image array_id>/@labels/<name>`. An `array_id` rather than a
  // `source_id` because what an upload tracks is always a *tensor* of a
  // source, never the source itself -- a source is discovered, or is the
  // scratch source the server serves, and neither takes an upload.
  //
  // It alone names the attempt: a name is single-use for the life of the
  // server (`add_tensor` refuses a collision), so what it finds is what the
  // caller created.
  string array_id = 1;

  // Where to move it: READY (publish -- seal writes, open reads) or DISCARDED
  // (give up, and release whatever the server minted for it). Setting the
  // state it is already in is a no-op, and moving back down the ladder is
  // refused. PENDING and STATE_UNSPECIFIED are not settable: an upload starts
  // PENDING and nothing returns it there yet.
  biopb.tensor.UploadStatus.State state = 2;

  // Why, for DISCARDED only. Consumer-facing: it is what a poller waiting on
  // this result reads back.
  string reason = 3;
}

// Create-or-update a batch of annotations, applied in one transaction.
message RoiPut {
  // The tensor every annotation in this batch belongs to (unversioned
  // array_id). Each row's array_id must match it or be empty.
  string array_id = 1;
  // Optimistic concurrency. When true, an annotation whose `rev` differs from
  // the stored one is reported as a conflict and NOT applied; the rest of the
  // batch still lands. When false, last writer wins.
  bool check_rev = 2;
}

// Delete the streamed `roi_id`s; with an empty stream, every annotation on
// `array_id` in `set_name` (or every annotation on the tensor when `set_name`
// is empty too).
message RoiDelete {
  string array_id = 1;
  string set_name = 2;
}
