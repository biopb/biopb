syntax = "proto3";

package biopb.tensor;

option java_multiple_files = true;
option java_package = "biopb.tensor";

// A tensor handed across processes: the answer a GetFlightInfo gave, and the
// connection facts to act on it.
//
// The structure is Arrow's own. `flight_info` is a serialized
// `arrow.flight.protocol.FlightInfo`, exactly as the tensor server answers a
// `tensor_read` GetFlightInfo: its `descriptor.command` is the resolved
// `TensorDescriptor`; each endpoint is the chunk ticket with its `ChunkBounds`
// in `app_metadata`; the schema carries the wire-protocol and transfer
// metadata; and the FlightInfo's own `app_metadata` is the requested
// `SliceHint` when the read was sliced, so the consumer crops the chunk-aligned
// realized region back to what was asked for. A FlightInfo with no endpoints
// is a source declared before its chunks exist (the fast-return handle): the
// consumer calls GetFlightInfo with the embedded descriptor when it reads.
//
// What Arrow does not carry is where and as whom. A FlightInfo with no
// endpoints names no server, and every endpoint this server mints has an empty
// location list ("the server you asked"), which a forwarded handle cannot mean.
message SerializedTensor {
  reserved 1, 2, 5, 6, 100;
  reserved "tensor_descriptor", "original_slice_hint", "endpoints", "schema_metadata", "debug_pickled_array";

  // Flight server location URI (e.g., "grpc://localhost:8815")
  string location = 3;

  // Per-source capability token or the server token; empty if none.
  string auth_token = 4;

  // Serialized arrow.flight.protocol.FlightInfo; see above.
  bytes flight_info = 7;
}
