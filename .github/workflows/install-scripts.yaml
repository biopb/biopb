# Check the installer on every PR that touches it, and publish the bootstrap
# scripts to biopb.org when they land on main. These are served at the canonical
# one-liner URLs:
#   - install/install.sh       -> biopb.org/install.sh
#   - install/install.ps1      -> biopb.org/install.ps1
#   - install/biopb-engine.ps1 -> biopb.org/biopb-engine.ps1
#
# They land in a reserved /install/ subtree of the webroot that biopb-site's
# deploy excludes from its --delete (see biopb-site/.github/workflows/deploy.yml),
# so a push-to-main site deploy never wipes them -- exactly the arrangement the
# SDK API docs use for /docs/api/ (see api-docs.yaml). This replaced an nginx
# proxy_pass to raw.githubusercontent.com, which was hitting HTTP 429.
#
# The checks exist because until #648 NOTHING ran on a PR touching install/: the
# lint workflow is filtered to '**/*.py', and the only verification here fired on
# push-to-main, i.e. after the merge. A broken .iss was discoverable solely by
# cutting a release.
#
# Three layers, cheapest first:
#   check  parse + lint      does it even load
#   unit   pytest            do its parsers return the right answer (#653)
#   gui    ISCC compile      does the Windows wizard still build
# The layer above these -- installing for real, in a container -- costs minutes
# and lives in installer-scenarios.yaml, on dispatch.
#
# workflow_dispatch is a dry run: it checks everything but never touches SSH or
# the server.
name: Install scripts

on:
  # Checks. Broad path net: the .iss and the docs live under install/ too, and a
  # PR that changes only the GUI still needs the compile job below.
  pull_request:
    branches: [main, dev]
    paths:
      - 'install/**'
      - '.github/workflows/install-scripts.yaml'
  # Publish. Narrow to exactly the three served files -- a change to the .iss or
  # the README is not a reason to rsync.
  push:
    branches: [main]
    paths:
      - 'install/install.sh'
      - 'install/install.ps1'
      - 'install/biopb-engine.ps1'
  workflow_dispatch:

concurrency:
  # Keyed by ref so PRs never queue behind each other; two pushes to main still
  # share a group, which is what keeps concurrent rsyncs from interleaving.
  group: install-scripts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Scripts parse and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Parse install.sh
        run: bash -n install/install.sh

      - name: Parse the test harness
        run: bash -n install/test/run.sh install/test/assert.sh

      - name: Lint the shell scripts
        run: |
          # No exclusions: the 7 findings this gate arrived with are fixed (#653
          # item 5). Keep it that way -- an exclusion added here to land a PR is
          # a rule switched off for every future one.
          #
          # The scenario harness is linted alongside the installer. It only runs
          # on dispatch, so a mistake in it would otherwise sit undiscovered
          # until someone reached for it -- which is always the moment they are
          # trying to debug something else.
          shellcheck install/install.sh install/test/run.sh install/test/assert.sh

      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          # A real tokenizer, not `test -s`: ubuntu-latest ships PowerShell 7, so
          # the parser that would reject these on a user's machine is available
          # here for free. This is the only check the two .ps1 files get -- the
          # engine is 1700 lines that no test executes.
          $bad = $false
          foreach ($f in 'install/install.ps1', 'install/biopb-engine.ps1') {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $bad = $true
                  Write-Host "::error file=$f::$($errors.Count) parse error(s)"
                  $errors | ForEach-Object {
                      Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
                  }
              } else {
                  Write-Host "OK: $f"
              }
          }
          if ($bad) { exit 1 }

  unit:
    name: Installer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      # --no-project: these tests import nothing from the monorepo -- they drive
      # install.sh and biopb-engine.ps1 by subprocess -- so syncing the workspace
      # (buf, proto codegen, napari) would be minutes spent on nothing they use.
      #
      # ubuntu-latest ships pwsh 7, so the PowerShell half of the extras contract
      # runs here rather than needing a Windows runner. It is the half most worth
      # running: biopb-engine.ps1 is 1700 lines that nothing else executes, and
      # the parser it shares with install.sh is where the two last drifted apart.
      - name: Run the installer tests
        run: uv run --no-project --with pytest pytest -v --color=yes install/test

      - name: Confirm PowerShell was actually exercised
        run: |
          # A skip is silent, and "24 skipped" reads a lot like "24 passed" in a
          # green run. If pwsh ever stops being preinstalled, the contract quietly
          # covers one parser instead of two -- which is precisely the state #653
          # exists to end. Fail loudly instead.
          command -v pwsh

  gui:
    name: GUI installer compiles
    # Skipped on the push-to-main publish run, whose paths cannot include the
    # .iss anyway. Dispatch runs it so the dry run stays a full check.
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The same compile release.yaml runs, moved to where it can still block a
      # merge. The .iss packages only ..\biopb-engine.ps1 -- already in the
      # checkout -- so this needs no build steps ahead of it, and AppVersion
      # self-defaults to 0.0.0-dev when CI does not inject a release tag.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile biopb-setup.iss
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /O"$env:RUNNER_TEMP" install\gui\biopb-setup.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }

  publish:
    name: Publish to biopb.org
    # Both gates, not just `check`: what gets rsynced here is the very file the
    # unit tests exercise, and biopb.org/install.sh is what every new user pipes
    # into bash. Neither job is filtered by event, so both run on this push.
    needs: [check, unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BIOPB_ORG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H biopb.org >> ~/.ssh/known_hosts

      - name: Publish install scripts with rsync
        run: |
          # Stage exactly the three served scripts, then mirror with --delete so
          # the reserved /install/ subtree holds only these (and drops any file
          # that was renamed/removed upstream) -- mirrors api-docs.yaml.
          mkdir -p _install_publish
          cp install/install.sh install/install.ps1 install/biopb-engine.ps1 _install_publish/
          ssh -i ~/.ssh/id_ed25519 jyu@biopb.org \
            'mkdir -p /var/www/biopb.org/install'
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            _install_publish/ jyu@biopb.org:/var/www/biopb.org/install/
