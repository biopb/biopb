name: Image Runtime CI

# Test/build on branch pushes & PRs. PUBLISH the biopb-image-base Docker image
# only by manual dispatch, tagged with the commit SHA (`sha-<7 chars>`): the image
# bundles the in-repo biopb-tensor-server, so neither the SDK's `v*` tag nor the
# product's `release-v*` says what is inside it.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'biopb-image-runtime/**'
      - 'biopb-tensor-server/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'src/main/python/**'
      - 'pyproject.toml'
      - '.github/workflows/image-runtime-ci.yaml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'biopb-image-runtime/**'
      - 'biopb-tensor-server/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'src/main/python/**'
      - 'pyproject.toml'
      - '.github/workflows/image-runtime-ci.yaml'
  workflow_dispatch:
    inputs:
      latest:
        description: Also move the :latest tag to this image
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Container-free unit + service tests. The server-backed tests launch an Ops
  # server file as a local subprocess (no Docker, no GPU); the pure suites
  # (stitch / dynamics_local) need only numpy + scipy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools_scm needs tags for versioning

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      # biopb is NOT on PyPI; install it editable from source first. The
      # tensor server (also not on PyPI) is optional for the runtime and needs
      # Python 3.12; without it the tests that return results by reference skip.
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[tensor]"
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pip install -e "./biopb-tensor-server"
          fi
          pip install -e "./biopb-image-runtime[test]"

      - name: Run tests
        run: pytest biopb-image-runtime/tests/

  # Build the base Docker image and prove the shipped package imports. This is
  # the safety net for pyproject.toml <-> requirements.txt drift and any
  # packaging breakage that only manifests inside the image — invisible to a
  # local `pip install -e .` (see biopb/biopb#26: scipy was added to
  # pyproject.toml but the image installs from requirements.txt).
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools_scm needs tags for versioning

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      # The Dockerfile COPYs pre-built wheels for biopb and biopb-tensor-server
      # from wheels/. Neither is published to PyPI, so build both from the
      # current working tree (this validates the tree under review — equivalent
      # to scripts/build.sh --dev — rather than a released tag).
      - name: Build wheels
        run: |
          pip wheel . --no-deps -w wheels/
          pip wheel ./biopb-tensor-server --no-deps -w wheels/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: biopb-image-runtime/Dockerfile
          load: true
          tags: biopb-image-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The package eagerly imports stitch -> dynamics_local -> scipy.ndimage at
      # import time, so a missing runtime dep in the image fails here, not just
      # in a derived service at deploy time.
      - name: Smoke-test image import
        run: |
          docker run --rm biopb-image-base:ci \
            python -c "from biopb_image_base import stitch, dynamics_local; import scipy; print('image import ok')"

  # Manual dispatch only: builds the image from the dispatched commit and pushes it
  # to ghcr.io + Docker Hub jiyuuchc/ as `sha-<7 chars>` (and `:latest` unless the
  # `latest` input is off). Idempotent: a SHA already in both registries is
  # skipped, so re-dispatching a commit is a noop. This is the ONLY place
  # image-base is published — release.yaml does not build it.
  publish:
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags for setuptools_scm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image-base Dockerfile COPYs biopb-*.whl + biopb_tensor_server-*.whl.
      # Neither is on PyPI, so build both from the dispatched commit.
      - name: Build wheels
        run: |
          pip wheel . --no-deps -w wheels/
          pip wheel ./biopb-tensor-server --no-deps -w wheels/

      - name: Compute tags + labels
        id: ver
        run: |
          set -euo pipefail
          # The dispatched commit's short SHA is the image's version: it is a clean,
          # Docker-safe tag and names exactly what the image was built from.
          TAG="sha-$(git rev-parse --short=7 HEAD)"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          owner="${{ github.repository_owner }}"
          {
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/$owner/biopb-image-base:$TAG"
            echo "docker.io/jiyuuchc/biopb-image-base:$TAG"
            if [[ "${{ inputs.latest }}" == "true" ]]; then
              echo "ghcr.io/$owner/biopb-image-base:latest"
              echo "docker.io/jiyuuchc/biopb-image-base:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          # What the image bundles, read off the wheels the Dockerfile installs.
          biopb=$(basename wheels/biopb-*.whl | cut -d- -f2)
          ts=$(basename wheels/biopb_tensor_server-*.whl | cut -d- -f2)
          {
            echo "labels<<LABELS_EOF"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "io.biopb.biopb-version=$biopb"
            echo "io.biopb.biopb-tensor-server-version=$ts"
            echo "LABELS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "image-base $TAG (biopb $biopb, tensor-server $ts)"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jiyuuchc
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Idempotent: skip only if this SHA is already in BOTH registries (re-dispatch
      # a commit -> noop). Checking both (not just ghcr) means a partial prior publish
      # (ghcr pushed, Docker Hub failed) re-publishes to fill the gap instead of
      # skipping and leaving Docker Hub permanently missing the version.
      - name: Check if already published
        id: gate
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          ver="${{ steps.ver.outputs.version }}"
          ghcr="ghcr.io/$owner/biopb-image-base:$ver"
          hub="docker.io/jiyuuchc/biopb-image-base:$ver"
          if docker manifest inspect "$ghcr" >/dev/null 2>&1 \
             && docker manifest inspect "$hub" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$ver already in both registries — skip"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: image-base image
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: biopb-image-runtime/Dockerfile
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          labels: ${{ steps.ver.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
