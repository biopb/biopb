# CI for biopb-mcp (napari plugin + MCP server). Lives in the monorepo at
# biopb-mcp/. This is a TEST-ONLY workflow: biopb-mcp is no longer published to
# PyPI (the product ships as the release-v* wheel triple the installer
# file://-installs — see docs/release-model.md). biopb-mcp is a product component,
# so its version comes from the single `release-v*` tag (setuptools_scm stamps the
# clean X.Y.Z onto the wheel built in release.yaml); there is no per-package tag.
#
# push and pull_request carry the SAME paths filter so branch-push and PR runs are
# scoped identically (test-only, MCP-relevant changes), with no tag trigger.
name: MCP CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'biopb-mcp/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'src/main/python/**'
      - 'biopb-tensor-server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/mcp-ci.yaml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'biopb-mcp/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'src/main/python/**'
      - 'biopb-tensor-server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/mcp-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Python suite. Sparse matrix mirroring the other monorepo CIs: all versions on
  # Linux (where version bugs surface), plus one version on macOS/Windows (where
  # platform/Qt bugs surface — the bundle ships on all three).
  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools_scm needs tags for versioning

      # vispy/napari need a GL context; provide a headless display + Qt libs.
      # Windows OpenGL comes from the gl-ci-helpers step below, not from here:
      # this action's Windows half downloads Mesa3D only to point VTK at an
      # offscreen renderer (`VTK_DEFAULT_OPENGL_WINDOW`), and nothing in the
      # suite imports VTK or vedo. That download is served from a third-party
      # release mirror and has failed the whole Windows job three times in a
      # week with `curl: (52) Empty reply from server`, instantly and past its
      # own retries -- so it is turned off rather than retried harder.
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
          install-mesa3d-offscreen: false

      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Resolve the whole workspace so biopb[tensor] and biopb-tensor-server[web]
      # come from the in-tree members (the server is never on PyPI). uv is the
      # workspace-aware installer; this is why CI no longer uses tox+pip.
      - name: Install (workspace, mcp extra + testing group)
        run: uv sync --package biopb-mcp --extra mcp --group testing --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest -v --color=yes --cov=biopb_mcp --cov-report=xml biopb-mcp/src/biopb_mcp/_tests

      # Deselected from the run above (pyproject addopts) because each token is a
      # real resolver run. Resolves every `pkg:` a shipped skill's `checklist:` declares against
      # the environment just built, so a skill whose package installs only by
      # downgrading biopb's own deps fails here rather than on a user's machine.
      # Metadata only -- nothing is downloaded or installed.
      #
      # This step owns ONE question: does installing it move something already
      # here. That is fatal wherever it happens -- a live kernel has the old
      # versions imported -- so one red cell rejects the skill, and required and
      # optional packages are judged the same way.
      #
      # Whether the package can be installed on a platform at all is a different
      # question with a different verdict, and it is the skill-availability job
      # below rather than another per-cell step (#680).
      - name: Skill package satisfiability
        run: uv run --no-sync pytest -v --color=yes -m satisfiability biopb-mcp/src/biopb_mcp/_tests/skills

      - name: Coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}

  # Wheel availability for every interpreter x platform biopb supports, from one
  # Linux job: `uv pip compile` resolves for a platform that is not present, so
  # this covers all nine cells where the matrix above covers five -- and, more to
  # the point, it is a single place that can render a per-cell verdict. Split out
  # from the matrix in #680, where the old shape's "one red cell rejects" was
  # shown to be not a policy choice but the only rule five independent pytest
  # runs could express.
  #
  # A platform hole is reported, not rejected: `checklist:` informs the agent and
  # gates nothing, so a session without the package says so and works around it.
  # Installing on NO cell still fails -- that is a token nobody can ever satisfy
  # rather than a platform gap.
  skill-availability:
    name: skill package availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `biopb`'s build generates the protobuf stubs, and it is installed below
      # because biopb_mcp._config imports biopb._locations.
      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # No dependency tree: the grid resolves metadata for interpreters that are
      # not here, so napari and the rest are never imported. The workspace still
      # goes in `--no-deps` -- `biopb_mcp/__init__.py` reads its own installed
      # metadata, and pytest reaches it through the package conftest, which
      # imports the shared config out of `biopb`. The checkout is the point: the
      # co-resolve uses this branch's biopb-mcp, not the last release.
      - name: Install (metadata only)
        run: |
          uv venv
          uv pip install pytest pyyaml packaging
          uv pip install --no-deps -e biopb-mcp -e .

      - name: Skill package availability
        run: >-
          uv run --no-sync pytest -v --color=yes -m availability
          biopb-mcp/src/biopb_mcp/_tests/skills/test_availability.py
