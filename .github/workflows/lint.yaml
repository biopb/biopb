# Fast Python lint/format gate for the whole monorepo (issue #82). One job,
# no matrix — ruff is a static analyzer, so a single runner/Python is enough,
# and it spans all four workspace packages via the root [tool.ruff] config.
#
# Keep the ruff version aligned with the pre-commit pin in
# .pre-commit-config.yaml (ruff-pre-commit rev).
name: Lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '**/pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run ruff (lint + format check)
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.15
          args: check --no-fix
      - name: Run ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.15
          args: format --check
      # Order-dependent package-façade imports (#619, #621): `from <pkg> import
      # X` at module scope, where X is a name <pkg>/__init__.py binds rather
      # than a submodule, loads only while __init__ stays in its current order.
      # Stdlib AST, no install — and this is the only Python gate that fires on
      # a change to any of the four packages, so it is where a repo-wide check
      # belongs. Also runs under pytest in the client suite.
      - name: Check for order-dependent package-façade imports
        run: python3 src/test/python/facade_import_test.py
