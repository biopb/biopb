# API-reference + development-docs build for biopb.
#
# This is a SEPARATE mkdocs project from biopb-site: it renders the
# auto-generated Python API/CLI reference (mkdocstrings, mkdocs-typer2) plus
# the project's own development docs (gen_dev_docs.py, pulled from docs/ and
# each sibling package's docs/), and is published by the release workflow to
# https://biopb.org/docs/api/python/ — a namespace the main site's deploy
# excludes from its --delete (see biopb-site/.github/workflows/deploy.yml).
#
# Build locally (from repo root):
#   uv sync --extra doc --extra tensor
#   uv run mkdocs build -f docs-api/mkdocs.yml      # -> docs-api/site/
#   uv run mkdocs serve  -f docs-api/mkdocs.yml     # live preview

site_name: biopb
site_description: API reference for the biopb Python SDK (biopb.image, biopb.tensor), plus the project's development docs.
site_url: https://biopb.org/docs/api/python/
repo_url: https://github.com/biopb/biopb
repo_name: biopb/biopb
edit_uri: blob/main/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
  # gen-files + literate-nav build the reference (gen_ref_pages.py, one page per
  # public module) and the development docs (gen_dev_docs.py, pulled from docs/
  # and each sibling package's docs/) at build time; nothing under
  # docs/reference/ or docs/development/ is checked in.
  - gen-files:
      scripts:
        - gen_ref_pages.py
        - gen_dev_docs.py
  - literate-nav:
      nav_file: SUMMARY.md
  # Renders the biopb CLI's own command tree (see docs/cli.md) by importing
  # the Typer app and walking it -- unlike mkdocstrings, this needs the
  # `tensor` extra installed (biopb.tensor.cli imports pyarrow/dask).
  - mkdocs-typer2:
      pretty: true
      engine: native
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Source roots (relative to this config). mkdocstrings/griffe analyze
          # statically from here, so the package's runtime deps (pyarrow, dask,
          # …) need not be importable to build the docs.
          paths:
            - ../src/main/python
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            # Hide private/dunder members; modules are pre-filtered in the gen
            # script, this drops leading-underscore names within each module.
            filters:
              - "!^_"

nav:
  - Overview: index.md
  - CLI reference: cli.md
  - API reference: reference/
  - Development: development/
