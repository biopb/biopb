[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "biopb-image-base"
dynamic = ["version"]
requires-python = ">=3.10"
authors = [{name = "Ji Yu", email = "jyu@uchc.edu"}]
description = "Serve functions over the biopb.image Ops protocol"
readme = "README.md"
license = "MIT"
# The core serves inline pixels: enough for a server file whose inputs and
# results fit in a message. Lazy input and a plane sink need [lazy].
dependencies = [
  "biopb",
  "grpcio",
  "grpcio-health-checking",
  "protobuf",
  "numpy",
]

[project.optional-dependencies]
lazy = [
  "biopb[tensor]",
]
# The flow-stitching helpers (stitch, dynamics_local).
stitch = [
  "scipy",
]
test = [
  "pytest >= 7.0",
  "biopb[tensor]",
  "biopb-tensor-server",
  "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["biopb_image_base*"]

# Versioned off the SDK tag `v*` (shared with biopb Python/Java), NOT the product
# `release-v*`: a server file's header resolves it from PyPI next to biopb, so
# the wheel publishes on the SDK's tag (python-ci), as does the Docker base
# image (image-runtime-ci). root = ".." (monorepo subdir); the
# --match keeps `git describe` off the product's `release-v*` tags.
[tool.setuptools_scm]
version_file = "src/biopb_image_base/_version.py"
root = ".."
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:(?:a|b|rc)[0-9]+)?)$"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --tags --match 'v*'"

[project.urls]
Homepage = "https://github.com/biopb/biopb"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
