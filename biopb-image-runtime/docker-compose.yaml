# Single-container setup: an Ops server with its embedded tensor cache
# For testing lazy data handling and gRPC infrastructure
#
# Build from repo root:
#   docker compose -f biopb-image-runtime/docker-compose.yaml build
#   docker compose -f biopb-image-runtime/docker-compose.yaml up
#
# Ports:
#   50051: gRPC Ops service (echo_server.py); the token it mints is in its log
#   8817: Arrow Flight tensor server (for lazy data access from clients)
#
# Note: tensor-external-location should be set to host's externally reachable address
# For local testing: "grpc://localhost:8817"
# For deployment: "grpc://<hostname>:8817"

services:
  echo:
    build:
      context: ..
      dockerfile: biopb-image-runtime/Dockerfile
    ports:
      - "50051:50051"
      - "8817:8817"
    volumes:
      - tensor-cache:/data/cache
      - ./echo_server.py:/opt/biopb/echo_server.py:ro
    environment:
      BIOPB_LOG_LEVEL: "INFO"
    command: [
      "python", "/opt/biopb/echo_server.py",
      "--host", "0.0.0.0",
      "--port", "50051",
      "--cache-dir", "/data/cache",
      "--cache-size", "32GB",
      "--tensor-port", "8817",
      "--tensor-external-location", "grpc://localhost:8817",
    ]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  tensor-cache:
    # Named volume for embedded tensor cache
    # Data persists across container restarts
